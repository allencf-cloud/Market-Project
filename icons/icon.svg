<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Industrial Blueprint Grid Pattern -->
    <pattern id="blueprintGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#232425" stroke-width="0.8" opacity="0.15" />
    </pattern>
    <pattern id="diagonalHatch" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#D0312D" stroke-width="3" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Parchment Base with heavy Charcoal border (Zero Radius) -->
  <rect width="512" height="512" fill="#EFECE6" stroke="#232425" stroke-width="16" />
  <rect width="512" height="512" fill="url(#blueprintGrid)" />

  <!-- Diagonal Constructivist Slash Accent (Red & Ochre) -->
  <polygon points="0,0 512,180 512,240 0,60" fill="#D0312D" opacity="0.9" />
  <polygon points="0,60 512,240 512,260 0,80" fill="#D49B35" />

  <!-- Corner Rivet Screws -->
  <circle cx="28" cy="28" r="8" fill="#8C8C8C" stroke="#232425" stroke-width="4" />
  <circle cx="484" cy="28" r="8" fill="#8C8C8C" stroke="#232425" stroke-width="4" />
  <circle cx="28" cy="484" r="8" fill="#8C8C8C" stroke="#232425" stroke-width="4" />
  <circle cx="484" cy="484" r="8" fill="#8C8C8C" stroke="#232425" stroke-width="4" />

  <!-- Industrial Constructivist Block Cart Graphic -->
  <g transform="translate(64, 110)">
    <!-- Shadow block -->
    <polygon points="50,110 320,110 290,240 100,240" fill="#232425" opacity="0.2" />

    <!-- Solid Cart Chassis -->
    <polygon points="40,100 310,100 280,230 90,230" fill="#EFECE6" stroke="#232425" stroke-width="12" />
    <polygon points="40,100 310,100 280,230 90,230" fill="url(#diagonalHatch)" />

    <!-- Constructivist Monoline Handle & Support -->
    <polyline points="20,50 60,50 100,230 290,230" fill="none" stroke="#232425" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Heavy Industrial Wheels -->
    <circle cx="110" cy="280" r="28" fill="#232425" />
    <circle cx="110" cy="280" r="14" fill="#EFECE6" stroke="#D0312D" stroke-width="6" />

    <circle cx="260" cy="280" r="28" fill="#232425" />
    <circle cx="260" cy="280" r="14" fill="#EFECE6" stroke="#D0312D" stroke-width="6" />

    <!-- Soviet Red Star & Safety Stamp -->
    <polygon points="320,40 332,68 362,68 338,86 348,114 320,96 292,114 302,86 278,68 308,68" fill="#D0312D" stroke="#232425" stroke-width="4" />
  </g>

  <!-- Factory Manifest Typography -->
  <text x="256" y="445" font-family="'Bebas Neue', Impact, sans-serif" font-weight="900" font-size="44" fill="#232425" text-anchor="middle" letter-spacing="4">SMART GROCERY</text>
  <text x="256" y="478" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="16" fill="#D0312D" text-anchor="middle" letter-spacing="3">MANIFES INDUSTRIAL 1920</text>
</svg>
